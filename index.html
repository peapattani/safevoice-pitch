<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SafeVoice — ทุกรายงานคือการป้องกันอุบัติเหตุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1628; --dark:#0D1E35; --card:#0F2540; --card2:#112A48; --border:#1A3050;
    --green:#00C96A; --greendk:#00A855; --amber:#F59E0B; --red:#EF4444; --purple:#A855F7;
    --white:#E8F4FF; --muted:#5A8AAA; --ice:#C8E6FF; --gold:#FFD700;
    --mono:'JetBrains Mono', monospace; --sans:'Sarabun', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ font-family:var(--sans); background:var(--navy); color:var(--white); line-height:1.6; }
  ::selection{ background:var(--green); color:#001a08; }

  /* ===================== SLIDE ENGINE ===================== */
  #slides{ height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory; }
  .slide{
    height:100vh; scroll-snap-align:start; scroll-snap-stop:always;
    overflow-y:auto; display:flex; flex-direction:column; justify-content:center;
    padding:100px 28px 56px; position:relative;
  }
  .wrap{ max-width:1120px; margin:0 auto; width:100%; }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--green); font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{ content:''; width:22px; height:1px; background:var(--green); display:inline-block; }
  h1,h2,h3{ font-weight:800; letter-spacing:-0.01em; }
  h2{ font-size:clamp(24px,3.4vw,36px); margin-bottom:14px; }
  .lead{ font-size:clamp(13px,1.3vw,16px); color:var(--ice); max-width:680px; }
  .fade-up{ opacity:0; transform:translateY(20px); transition:opacity .6s ease, transform .6s ease; }
  .fade-up.in{ opacity:1; transform:translateY(0); }

  /* ---- fixed chrome ---- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; background:linear-gradient(#0A1628 60%, transparent);
  }
  .topbar-logo{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; }
  .logo-icon{
    width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--green),var(--greendk));
    display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .topbar-right{ display:flex; align-items:center; gap:12px; }
  .topbar-badge{
    font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--border);
    padding:5px 12px; border-radius:20px; display:none;
  }
  @media (min-width:640px){ .topbar-badge{ display:block; } }
  .fs-btn{
    font-family:var(--mono); font-size:11px; color:var(--navy); background:var(--green); border:none;
    padding:7px 14px; border-radius:20px; cursor:pointer; font-weight:700;
  }
  .fs-btn:hover{ background:#0adf7c; }

  .dotnav{ position:fixed; right:20px; top:50%; transform:translateY(-50%); z-index:60; display:flex; flex-direction:column; gap:9px; }
  .dotnav button{
    all:unset; cursor:pointer; width:8px; height:8px; border-radius:50%; background:var(--border);
    display:block; transition:.25s; position:relative;
  }
  .dotnav button.active{ background:var(--green); box-shadow:0 0 0 4px #00c96a22; }
  .dotnav button span{
    position:absolute; right:18px; top:50%; transform:translateY(-50%);
    font-family:var(--mono); font-size:10.5px; color:var(--muted); white-space:nowrap; opacity:0; transition:.2s; pointer-events:none;
  }
  .dotnav button:hover span{ opacity:1; }
  @media (max-width:899px){ .dotnav{ display:none; } }

  .slidectr{
    position:fixed; left:28px; bottom:20px; z-index:60; font-family:var(--mono); font-size:12px; color:var(--muted);
  }
  .slidectr b{ color:var(--green); }
  .navbtns{ position:fixed; right:24px; bottom:20px; z-index:60; display:flex; gap:8px; }
  .navbtns button{
    all:unset; cursor:pointer; width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--ice); background:var(--card);
  }
  .navbtns button:hover{ border-color:var(--green); color:var(--green); }
  @media (max-width:640px){ .slidectr,.navbtns{ display:none; } }

  /* ===================== HERO ===================== */
  .hero{
    background:
      radial-gradient(ellipse 900px 500px at 15% 0%, #00c96a1a, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 30%, #0d2a1a80, transparent 60%),
      var(--navy);
  }
  .hero-badge{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px;
    color:var(--gold); background:#ffd70014; border:1px solid #ffd70044; padding:7px 14px;
    border-radius:20px; margin-bottom:22px; width:fit-content;
  }
  .hero-logo{ display:flex; align-items:center; gap:14px; margin-bottom:4px; }
  .hero-logo .logo-icon{ width:46px; height:46px; border-radius:14px; font-size:21px; }
  .hero h1{ font-size:clamp(40px,7vw,78px); line-height:.95; }
  .hero .tagline{ font-size:clamp(17px,2vw,24px); color:var(--green); font-weight:700; margin-top:12px; }
  .hero .sub{ font-size:clamp(13px,1.4vw,16px); color:var(--ice); max-width:600px; margin-top:12px; }
  .hero-team{ font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:14px; }
  .hero-team b{ color:var(--ice); font-weight:600; }
  .hero-stats{ display:flex; flex-wrap:wrap; gap:9px; margin-top:22px; }
  .pill{ font-family:var(--mono); font-size:12px; border:1px solid var(--border); background:var(--card); padding:7px 13px; border-radius:10px; color:var(--ice); }
  .pill b{ color:var(--green); }

  /* ===================== PROBLEM (Heinrich) ===================== */
  .triangle-solo{ display:flex; justify-content:center; margin-top:22px; }
  .triangle-wrap{ display:flex; flex-direction:column; align-items:center; }
  .triangle-cap{ font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:12px; text-align:center; max-width:360px; }

  /* ===================== PROBLEM CULTURE (chain) ===================== */
  .callout{ border-radius:12px; padding:12px 18px; font-size:12.5px; display:flex; align-items:center; gap:10px; margin-top:20px; }
  .callout-red{ border:1px solid var(--red); background:#ef444414; color:#ffc2c2; }
  .callout-purple{ border:1px solid var(--purple); background:#a855f714; color:var(--ice); }
  .chain-list{ margin-top:20px; display:flex; flex-direction:column; align-items:center; }
  .chain-item{
    width:100%; max-width:640px; display:flex; align-items:center; gap:14px; background:var(--card);
    border:1px solid var(--border); border-radius:12px; padding:11px 18px; font-size:13px;
  }
  .chain-item .ci-icon{ font-size:18px; flex-shrink:0; }
  .chain-item.danger{ background:#2a0e0e; border-color:var(--red); color:#ffb4b4; }
  .chain-arrow{ color:var(--red); font-size:14px; margin:4px 0; }
  .limits-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }

  /* ===================== OBJECTIVES ===================== */
  .obj-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:24px; }
  @media (max-width:780px){ .obj-grid{ grid-template-columns:1fr; } }
  .obj-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .obj-card .oi{ font-size:22px; margin-bottom:8px; display:block; }
  .obj-card h4{ font-size:14.5px; margin-bottom:5px; color:var(--green); }
  .obj-card p{ font-size:12.5px; color:var(--muted); }

  /* ===================== HOW ===================== */
  .flow{ display:flex; gap:0; margin-top:32px; overflow-x:auto; padding-bottom:6px; }
  .flow-step{ flex:1 0 175px; position:relative; padding:0 12px; text-align:center; }
  .flow-step .num{
    width:40px; height:40px; border-radius:50%; margin:0 auto 10px;
    background:linear-gradient(135deg,var(--green),var(--greendk)); display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#001a08; font-family:var(--mono); font-size:15px; position:relative; z-index:2;
  }
  .flow-step h4{ font-size:13px; font-weight:700; margin-bottom:5px; }
  .flow-step p{ font-size:11.5px; color:var(--muted); }
  .flow-line{ position:absolute; top:20px; left:-50%; width:100%; height:2px; background:repeating-linear-gradient(90deg,var(--border) 0 6px, transparent 6px 12px); z-index:1; }
  .flow-step:first-child .flow-line{ display:none; }

  /* ===================== COMPARISON TABLE ===================== */
  .cmp-table{ margin-top:22px; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .cmp-row{ display:grid; grid-template-columns:1.1fr 1fr 1fr; }
  .cmp-row + .cmp-row{ border-top:1px solid var(--border); }
  .cmp-cell{ padding:11px 16px; font-size:12px; display:flex; align-items:center; }
  .cmp-row.head .cmp-cell{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; background:var(--dark); }
  .cmp-row.head .cmp-cell.new{ color:var(--green); }
  .cmp-cell.dim{ background:var(--card); font-weight:600; color:var(--ice); }
  .cmp-cell.old{ background:#150c0c; color:#c98a8a; }
  .cmp-cell.new{ background:#0a1e14; color:#7ACF9A; }
  .cmp-cell.new::before{ content:'✅ '; }

  /* ===================== PRODUCT MOCKUP ===================== */
  .mock-grid{ display:grid; grid-template-columns:230px 1fr; gap:32px; align-items:start; margin-top:24px; }
  @media (max-width:860px){ .mock-grid{ grid-template-columns:1fr; justify-items:center; } }
  .phone{ width:228px; border-radius:28px; border:6px solid #050c18; background:var(--navy); box-shadow:0 24px 50px -20px #000a,0 0 0 1px var(--border); overflow:hidden; }
  .phone-screen{ padding:15px 13px; }
  .phone-head{ display:flex; align-items:center; gap:8px; font-size:10px; color:var(--muted); margin-bottom:11px; }
  .mode-tabs{ display:flex; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:4px; margin-bottom:14px; }
  .mode-tab{ flex:1; text-align:center; padding:6px 4px; border-radius:8px; font-size:10px; color:var(--muted); }
  .mode-tab.active{ background:var(--green); color:#001a08; font-weight:700; }
  .record-btn{
    width:58px; height:58px; border-radius:50%; margin:4px auto 10px;
    background:linear-gradient(135deg,var(--green),var(--greendk)); box-shadow:0 0 0 9px #00c96a22;
    display:flex; align-items:center; justify-content:center; font-size:20px; animation:pulse 2s infinite;
  }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 #00c96a33; } 70%{ box-shadow:0 0 0 14px #00c96a00; } 100%{ box-shadow:0 0 0 0 #00c96a00; } }
  .waveform{ display:flex; justify-content:center; gap:3px; height:16px; align-items:flex-end; margin-bottom:10px; }
  .waveform span{ width:3px; background:var(--green); border-radius:2px; animation:wave .9s ease-in-out infinite; }
  .waveform span:nth-child(1){ height:6px; } .waveform span:nth-child(2){ height:14px; animation-delay:.1s; }
  .waveform span:nth-child(3){ height:8px; animation-delay:.2s; } .waveform span:nth-child(4){ height:16px; animation-delay:.3s; }
  .waveform span:nth-child(5){ height:7px; animation-delay:.4s; }
  @keyframes wave{ 0%,100%{ transform:scaleY(.5);} 50%{ transform:scaleY(1);} }
  .phone-note{ text-align:center; font-size:9.5px; color:var(--muted); margin-bottom:10px; }
  .photo-req{ font-size:9px; color:var(--red); text-align:center; margin-bottom:8px; }
  .result-card{ background:#0A1E10; border:1px solid #00c96a33; border-radius:12px; padding:10px; font-size:9.5px; color:#7ACF9A; line-height:1.5; }
  .result-card b{ display:block; color:var(--green); font-size:10px; margin-bottom:3px; }
  .admin-mock{ background:var(--dark); border:1px solid var(--border); border-radius:18px; padding:20px; box-shadow:0 20px 40px -22px #000c; }
  .admin-mock h4{ font-size:11.5px; color:var(--muted); font-family:var(--mono); margin-bottom:11px; }
  .verify-row{ display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:9px 14px; margin-bottom:7px; font-size:12px; }
  .badge{ font-size:9.5px; font-weight:700; padding:3px 9px; border-radius:5px; font-family:var(--mono); }
  .badge-pending{ background:#f59e0b22; border:1px solid var(--amber); color:var(--amber); }
  .badge-verified{ background:#00c96a22; border:1px solid var(--green); color:var(--green); }
  .badge-high{ background:#ef444422; border:1px solid var(--red); color:var(--red); }
  .lb-row{ display:flex; align-items:center; gap:12px; padding:7px 4px; border-bottom:1px solid var(--border); font-size:12px; }
  .lb-row:last-child{ border-bottom:none; }
  .lb-rank{ font-family:var(--mono); font-weight:800; width:20px; color:var(--gold); }
  .lb-name{ flex:1; }
  .lb-credit{ font-family:var(--mono); color:var(--green); font-weight:700; }

  /* ===================== CREDITS OFFSET ===================== */
  .tier-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:22px; }
  @media (max-width:780px){ .tier-grid{ grid-template-columns:1fr; } }
  .tier-card{ background:var(--card); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:14px; padding:16px 18px; }
  .tier-card.t-green{ border-left-color:var(--green); }
  .tier-card.t-amber{ border-left-color:var(--amber); }
  .tier-card.t-red{ border-left-color:var(--red); }
  .tier-card .t-level{ font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
  .tier-card .t-credit{ font-family:var(--mono); font-size:26px; font-weight:800; }
  .tier-card.t-green .t-credit{ color:var(--green); }
  .tier-card.t-amber .t-credit{ color:var(--amber); }
  .tier-card.t-red .t-credit{ color:var(--red); }
  .tier-card .t-note{ font-size:11.5px; color:var(--muted); margin-top:6px; }
  .offset-banner{
    margin-top:20px; text-align:center; font-size:14px; font-weight:700; color:var(--green);
    background:#0a1e14; border:1px solid #00c96a55; border-radius:14px; padding:16px 20px;
  }

  /* ===================== TECH ===================== */
  .tech-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:26px; }
  @media (max-width:780px){ .tech-grid{ grid-template-columns:1fr; } }
  .tech-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; }
  .tech-card .tag{ font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-bottom:8px; }
  .tech-card h4{ font-size:15px; margin-bottom:7px; }
  .tech-card p{ font-size:12.5px; color:var(--muted); }

  /* ===================== TRIAL RESULTS ===================== */
  .check-list{ margin-top:22px; display:flex; flex-direction:column; gap:9px; }
  .check-row{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 18px; font-size:13px;
  }
  .check-row .cr-value{ font-family:var(--mono); font-weight:700; color:var(--green); white-space:nowrap; }
  .check-row .cr-label::before{ content:'✅ '; }

  /* ===================== SCALE ===================== */
  .scale-top{ display:flex; flex-wrap:wrap; gap:26px; align-items:flex-end; margin-top:24px; margin-bottom:24px; }
  .big-stat{ font-family:var(--mono); font-size:46px; font-weight:800; color:var(--green); line-height:1; }
  .big-stat-label{ font-size:12px; color:var(--muted); margin-top:6px; }
  .branch-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:12px; border:1px solid var(--border); background:var(--card); padding:7px 13px; border-radius:20px; }
  .metric-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:22px; }
  @media (max-width:780px){ .metric-grid{ grid-template-columns:1fr; } }
  .metric-slot{ border:1px dashed var(--border); border-radius:14px; padding:16px; text-align:center; color:var(--muted); }
  .metric-slot .m-label{ font-size:12px; margin-bottom:8px; }
  .metric-slot .m-value{ font-family:var(--mono); font-size:12px; color:var(--amber); }
  .note{ font-size:11.5px; color:var(--muted); margin-top:12px; }

  /* ===================== REACTIVE -> PROACTIVE ===================== */
  .rp-row{ display:flex; align-items:stretch; gap:0; margin-top:22px; }
  .rp-box{ flex:1; padding:16px 20px; border-radius:14px; }
  .rp-box.reactive{ background:var(--card); border:1px solid var(--border); }
  .rp-box.proactive{ background:linear-gradient(120deg,#00c96a22,#a855f733); border:1px solid var(--green); }
  .rp-box .rp-title{ font-weight:800; font-size:15px; margin-bottom:5px; }
  .rp-box.reactive .rp-title{ color:var(--muted); }
  .rp-box.proactive .rp-title{ color:var(--green); }
  .rp-box p{ font-size:12px; color:var(--ice); }
  .rp-arrow{ display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--green); padding:0 12px; flex-shrink:0; }
  .rp-groups{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  @media (max-width:780px){ .rp-groups{ grid-template-columns:1fr; } }
  .rp-group{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:13px 16px; }
  .rp-group h4{ font-size:12.5px; color:var(--green); margin-bottom:5px; }
  .rp-group p{ font-size:11.5px; color:var(--muted); }

  /* ===================== ROI ===================== */
  .roi-grid{ display:flex; align-items:center; gap:36px; margin-top:24px; flex-wrap:wrap; }
  .roi-cost{ min-width:200px; }
  .roi-cost .rc-label{ font-size:12px; color:var(--muted); margin-bottom:6px; }
  .roi-cost .rc-value{ font-family:var(--mono); font-size:28px; font-weight:800; color:var(--ice); }
  .roi-cost .rc-note{ font-size:11px; color:var(--muted); margin-top:6px; max-width:220px; }
  .roi-protect{
    flex:1; min-width:260px; text-align:center; padding:26px 20px; border-radius:20px;
    background:radial-gradient(circle at center, #00c96a2e, transparent 70%);
  }
  .roi-protect .rp-label{ font-size:14px; color:var(--white); margin-bottom:6px; }
  .roi-protect .rp-value{ font-family:var(--mono); font-size:44px; font-weight:800; color:var(--green); text-shadow:0 0 30px #00c96a66; }
  .roi-protect .rp-note{ font-size:13px; color:var(--ice); margin-top:4px; }

  /* ===================== ROADMAP ===================== */
  .road-list{ margin-top:24px; display:flex; flex-direction:column; }
  .road-item{ display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--border); }
  .road-item:last-child{ border-bottom:none; }
  .road-dot{ width:9px; height:9px; border-radius:50%; background:var(--green); margin-top:7px; flex-shrink:0; }
  .road-item h4{ font-size:14px; margin-bottom:3px; }
  .road-item p{ font-size:12.5px; color:var(--muted); }

  /* ===================== CONTACT ===================== */
  .contact-slide{ text-align:center; }
  .contact-slide h2{ max-width:780px; margin:0 auto 20px; }
  .contact-cards{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:28px; }
  .contact-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 22px; min-width:200px; text-align:left; }
  .contact-card .k{ font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-bottom:5px; }
  .contact-card .v{ font-size:13.5px; font-weight:600; }
  .footer-line{ position:absolute; bottom:18px; left:0; right:0; text-align:center; font-family:var(--mono); font-size:10.5px; color:var(--muted); }

  /* =====================================================================
     16:9 STAGE MODE (จอ >=900px เท่านั้น) — บังคับให้แสดงผลเป็นกรอบ 16:9
     เสมอ ไม่ว่าจอจริงจะอัตราส่วนอะไร ส่วนที่เหลือจะเป็นแถบดำ (letterbox)
     มือถือ (<900px) ใช้ layout แบบเดิม ไม่ยุ่งกับส่วนนี้
     ===================================================================== */
  @media (min-width:900px){
    #stage-wrap{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:#05070c; overflow:hidden; z-index:1;
    }
    #stage{
      width:1280px; height:720px; flex-shrink:0; position:relative; overflow:hidden;
      background:var(--navy); transform-origin:center center;

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('sv-data').textContent);
  const get = (obj, path) => path.split('.').reduce((o,k)=> (o||{})[k], obj);

  document.querySelectorAll('[data-key]').forEach(el=>{
    const val = get(DATA, el.getAttribute('data-key'));
    if(val !== undefined) el.textContent = val;
  });
  document.querySelectorAll('[data-key-html]').forEach(el=>{
    const val = get(DATA, el.getAttribute('data-key-html'));
    if(val !== undefined) el.innerHTML = val;
  });

  document.getElementById('hero-stats').innerHTML = DATA.hero.stats.map(s=>
    `<div class="pill">${s.value ? `<b>${s.value}</b> ` : ''}${s.label}</div>`
  ).join('');

  document.getElementById('chain-list').innerHTML = DATA.problemCulture.chain.map((c,i)=>
    (i>0 ? '<div class="chain-arrow">▼</div>' : '') +
    `<div class="chain-item${c.danger?' danger':''}"><span class="ci-icon">${c.icon}</span><span>${c.text}</span></div>`
  ).join('');
  document.getElementById('limits-row').innerHTML = DATA.problemCulture.limits.map(l=>`<div class="chip">${l}</div>`).join('');

  document.getElementById('obj-grid').innerHTML = DATA.objectives.items.map(o=>
    `<div class="obj-card"><span class="oi">${o.icon}</span><h4>${o.title}</h4><p>${o.body}</p></div>`
  ).join('');

  document.getElementById('how-flow').innerHTML = DATA.how.steps.map((s,i)=>
    `<div class="flow-step"><div class="flow-line"></div><div class="num">${i+1}</div><h4>${s.title}</h4><p>${s.body}</p></div>`
  ).join('');

  document.getElementById('cmp-table').innerHTML =
    `<div class="cmp-row head"><div class="cmp-cell dim">${DATA.comparison.headDim}</div><div class="cmp-cell old">${DATA.comparison.headOld}</div><div class="cmp-cell new" style="background:var(--dark)">${DATA.comparison.headNew}</div></div>` +
    DATA.comparison.rows.map(r=>
      `<div class="cmp-row"><div class="cmp-cell dim">${r.dim}</div><div class="cmp-cell old">${r.old}</div><div class="cmp-cell new">${r.new}</div></div>`
    ).join('');

  document.getElementById('product-verify').innerHTML = DATA.product.verifyRows.map(r=>
    `<div class="verify-row"><span>${r.label}</span><span class="badge badge-${r.badge}">${r.badgeText}</span></div>`
  ).join('');
  document.getElementById('product-leaderboard').innerHTML = DATA.product.leaderboard.map(r=>
    `<div class="lb-row"><span class="lb-rank">${r.rank}</span><span class="lb-name">${r.name}</span><span class="lb-credit">${r.credit}</span></div>`
  ).join('');

  document.getElementById('tier-grid').innerHTML = DATA.creditsOffset.tiers.map(t=>
    `<div class="tier-card t-${t.tone}"><div class="t-level">${t.level}</div><div class="t-credit">${t.credit}</div><div class="t-note">${t.note}</div></div>`
  ).join('');

  document.getElementById('tech-cards').innerHTML = DATA.tech.cards.map(c=>
    `<div class="tech-card"><div class="tag">${c.tag}</div><h4>${c.title}</h4><p>${c.body}</p></div>`
  ).join('');

  document.getElementById('check-list').innerHTML = DATA.trial.rows.map(r=>
    `<div class="check-row"><span class="cr-label">${r.label}</span><span class="cr-value">${r.value}</span></div>`
  ).join('');

  document.getElementById('scale-branches').innerHTML = DATA.scale.branches.map(b=>`<div class="chip">${b}</div>`).join('');
  document.getElementById('scale-metrics').innerHTML = DATA.scale.metrics.map(m=>
    `<div class="metric-slot"><div class="m-label">${m.label}</div><div class="m-value">${m.value}</div></div>`
  ).join('');

  document.getElementById('rp-groups').innerHTML = DATA.reactive.groups.map(g=>
    `<div class="rp-group"><h4>${g.title}</h4><p>${g.body}</p></div>`
  ).join('');

  document.getElementById('roadmap-items').innerHTML = DATA.roadmap.items.map(it=>
    `<div class="road-item"><div class="road-dot"></div><div><h4>${it.title}</h4><p>${it.body}</p></div></div>`
  ).join('');

  document.getElementById('contact-cards').innerHTML = DATA.contact.cards.map(c=>
    `<div class="contact-card"><div class="k">${c.label}</div><div class="v">${c.value}</div></div>`
  ).join('');

  const slidesEl = document.getElementById('slides');
  const slides = [...document.querySelectorAll('.slide')];
  const dotnav = document.getElementById('dotnav');
  const slidectr = document.getElementById('slidectr');

  slides.forEach((s,i)=>{
    const b = document.createElement('button');
    b.innerHTML = `<span>${s.dataset.label}</span>`;
    b.addEventListener('click', ()=> goTo(i));
    dotnav.appendChild(b);
  });
  const dots = [...dotnav.children];

  let current = 0;
  function updateActive(i){
    current = i;
    dots.forEach((d,j)=> d.classList.toggle('active', j===i));
    slidectr.innerHTML = `<b>${String(i+1).padStart(2,'0')}</b> / ${String(slides.length).padStart(2,'0')}`;
  }
  function goTo(i){
    i = Math.max(0, Math.min(slides.length-1, i));
    slides[i].scrollIntoView({ behavior:'smooth' });
  }

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const idx = slides.indexOf(e.target);
        updateActive(idx);
        e.target.querySelectorAll('.fade-up').forEach(el=> el.classList.add('in'));
      }
    });
  }, { root: slidesEl, threshold: 0.55 });
  slides.forEach(s=> io.observe(s));
  updateActive(0);

  document.getElementById('prevBtn').addEventListener('click', ()=> goTo(current-1));
  document.getElementById('nextBtn').addEventListener('click', ()=> goTo(current+1));

  window.addEventListener('keydown', (e)=>{
    if(['ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); goTo(current+1); }
    if(['ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); goTo(current-1); }
    if(e.key.toLowerCase()==='f'){ toggleFullscreen(); }
  });

  function toggleFullscreen(){
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
    else{ document.exitFullscreen(); }
  }
  document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', ()=>{
    document.getElementById('fsBtn').textContent = document.fullscreenElement ? '⛶ ออกจากเต็มจอ' : '⛶ เต็มจอ';
  });

  // ===================== 16:9 STAGE FIT (>=900px เท่านั้น) =====================
  // มือถือ (<900px) ไม่แตะเลย ปล่อยให้ layout เดิม (เต็มความกว้างจอ) ทำงานตามปกติ
  const DESKTOP_MIN = 900, STAGE_W = 1280, STAGE_H = 720;
  const stageEl = document.getElementById('stage');
  function fitStage(){
    if(window.innerWidth < DESKTOP_MIN){ stageEl.style.transform = 'none'; return; }
    const scale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    stageEl.style.transform = `scale(${scale})`;
  }
  fitStage();
  window.addEventListener('resize', fitStage);
})();
</script>
