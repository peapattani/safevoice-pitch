<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SafeVoice — ทุกรายงานคือการป้องกันอุบัติเหตุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1628; --dark:#0D1E35; --card:#0F2540; --card2:#112A48; --border:#1A3050;
    --green:#00C96A; --greendk:#00A855; --amber:#F59E0B; --red:#EF4444; --purple:#A855F7;
    --white:#E8F4FF; --muted:#5A8AAA; --ice:#C8E6FF; --gold:#FFD700;
    --mono:'JetBrains Mono', monospace; --sans:'Sarabun', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ font-family:var(--sans); background:var(--navy); color:var(--white); line-height:1.55; }
  ::selection{ background:var(--green); color:#001a08; }

  /* =====================================================================
     MOBILE-ONLY SLIDE ENGINE — ไม่มีโหมดเดสก์ท็อป/16:9 อีกต่อไป
     เพราะเปลี่ยนไปนำเสนอด้วย PPT แทน เว็บนี้ใช้แค่เปิดดูบนมือถือ
     ===================================================================== */
  #slides{ height:100vh; height:100dvh; overflow-y:scroll; scroll-snap-type:y mandatory; }
  .slide{
    height:100vh; height:100dvh; scroll-snap-align:start; scroll-snap-stop:always;
    overflow-y:auto; display:flex; flex-direction:column; justify-content:flex-start;
    padding:70px 18px 40px; position:relative;
  }
  .wrap{ max-width:520px; margin:0 auto; width:100%; }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--green); font-weight:600; margin-bottom:9px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; width:18px; height:1px; background:var(--green); display:inline-block; }
  h1,h2,h3{ font-weight:800; letter-spacing:-0.01em; }
  h2{ font-size:22px; margin-bottom:10px; line-height:1.25; }
  .lead{ font-size:13px; color:var(--ice); }
  .fade-up{ opacity:0; transform:translateY(16px); transition:opacity .5s ease, transform .5s ease; }
  .fade-up.in{ opacity:1; transform:translateY(0); }

  /* ---- fixed chrome ---- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; background:linear-gradient(#0A1628 65%, transparent);
  }
  .topbar-logo{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; }
  .logo-icon{
    width:24px; height:24px; border-radius:7px; background:linear-gradient(135deg,var(--green),var(--greendk));
    display:flex; align-items:center; justify-content:center; font-size:12px;
  }
  .topbar-badge{
    font-family:var(--mono); font-size:9.5px; color:var(--muted); border:1px solid var(--border);
    padding:4px 9px; border-radius:20px;
  }

  .dotnav{ position:fixed; bottom:10px; left:0; right:0; z-index:60; display:flex; justify-content:center; gap:6px; }
  .dotnav button{
    all:unset; cursor:pointer; width:6px; height:6px; border-radius:50%; background:var(--border); transition:.25s;
  }
  .dotnav button.active{ background:var(--green); width:15px; border-radius:4px; }

  /* ===================== HERO ===================== */
  .hero{
    background:
      radial-gradient(ellipse 500px 400px at 20% 0%, #00c96a1a, transparent 60%),
      radial-gradient(ellipse 400px 400px at 100% 30%, #0d2a1a80, transparent 60%),
      var(--navy);
  }
  .hero-badge{
    display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10.5px;
    color:var(--gold); background:#ffd70014; border:1px solid #ffd70044; padding:6px 12px;
    border-radius:20px; margin-bottom:16px; width:fit-content;
  }
  .hero-logo{ display:flex; align-items:center; gap:12px; margin-bottom:2px; }
  .hero-logo .logo-icon{ width:40px; height:40px; border-radius:12px; font-size:18px; }
  .hero h1{ font-size:44px; line-height:.95; }
  .hero .tagline{ font-size:18px; color:var(--green); font-weight:700; margin-top:10px; }
  .hero .sub{ font-size:13px; color:var(--ice); margin-top:10px; }
  .hero-team{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:11px; }
  .hero-team b{ color:var(--ice); font-weight:600; }
  .hero-stats{ display:flex; flex-wrap:wrap; gap:7px; margin-top:17px; }
  .pill{ font-family:var(--mono); font-size:11px; border:1px solid var(--border); background:var(--card); padding:6px 11px; border-radius:9px; color:var(--ice); }
  .pill b{ color:var(--green); }

  /* ===================== PROBLEM (Heinrich) ===================== */
  .triangle-solo{ display:flex; justify-content:center; margin-top:14px; }
  .triangle-wrap{ display:flex; flex-direction:column; align-items:center; }
  .triangle-cap{ font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:9px; text-align:center; }

  /* ===================== PROBLEM CULTURE (chain) ===================== */
  .callout{ border-radius:10px; padding:9px 13px; font-size:11.5px; display:flex; align-items:center; gap:8px; margin-top:13px; }
  .callout-red{ border:1px solid var(--red); background:#ef444414; color:#ffc2c2; }
  .callout-purple{ border:1px solid var(--purple); background:#a855f714; color:var(--ice); }
  .chain-list{ margin-top:13px; display:flex; flex-direction:column; align-items:center; }
  .chain-item{
    width:100%; display:flex; align-items:center; gap:10px; background:var(--card);
    border:1px solid var(--border); border-radius:10px; padding:8px 13px; font-size:12px;
  }
  .chain-item .ci-icon{ font-size:16px; flex-shrink:0; }
  .chain-item.danger{ background:#2a0e0e; border-color:var(--red); color:#ffb4b4; }
  .chain-arrow{ color:var(--red); font-size:12px; margin:2px 0; }
  .limits-row{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:11px; }
  .chip{ font-size:10.5px; border:1px solid var(--border); background:var(--card); padding:5px 10px; border-radius:16px; color:var(--ice); }

  /* ===================== OBJECTIVES ===================== */
  .obj-grid{ display:grid; grid-template-columns:1fr; gap:9px; margin-top:15px; }
  .obj-card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:11px 14px; }
  .obj-card .oi{ font-size:17px; margin-bottom:4px; display:block; }
  .obj-card h4{ font-size:13px; margin-bottom:3px; color:var(--green); }
  .obj-card p{ font-size:11.5px; color:var(--muted); }

  /* ===================== COMPARISON TABLE ===================== */
  .cmp-table{ margin-top:15px; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .cmp-row{ display:grid; grid-template-columns:1fr; }
  .cmp-row.head{ display:none; }
  .cmp-row + .cmp-row{ border-top:1px solid var(--border); }
  .cmp-cell{ padding:7px 12px; font-size:11.5px; display:flex; align-items:center; }
  .cmp-cell.dim{ background:var(--card); font-weight:700; color:var(--ice); padding-bottom:3px; }
  .cmp-cell.old{ background:#150c0c; color:#c98a8a; }
  .cmp-cell.new{ background:#0a1e14; color:#7ACF9A; }
  .cmp-cell.new::before{ content:'✅ '; }
  .cmp-cell.old::before{ content:'⛔ '; }

  /* ===================== PRODUCT MOCKUP ===================== */
  .mock-grid{ display:grid; grid-template-columns:1fr; gap:16px; margin-top:15px; justify-items:center; }
  .phone{ width:190px; border-radius:24px; border:5px solid #050c18; background:var(--navy); box-shadow:0 20px 40px -18px #000a,0 0 0 1px var(--border); overflow:hidden; }
  .phone-screen{ padding:12px 11px; }
  .phone-head{ display:flex; align-items:center; gap:6px; font-size:9px; color:var(--muted); margin-bottom:9px; }
  .mode-tabs{ display:flex; gap:5px; background:var(--card); border:1px solid var(--border); border-radius:9px; padding:3px; margin-bottom:11px; }
  .mode-tab{ flex:1; text-align:center; padding:5px 3px; border-radius:7px; font-size:9px; color:var(--muted); }
  .mode-tab.active{ background:var(--green); color:#001a08; font-weight:700; }
  .record-btn{
    width:48px; height:48px; border-radius:50%; margin:3px auto 8px;
    background:linear-gradient(135deg,var(--green),var(--greendk)); box-shadow:0 0 0 7px #00c96a22;
    display:flex; align-items:center; justify-content:center; font-size:17px; animation:pulse 2s infinite;
  }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 #00c96a33; } 70%{ box-shadow:0 0 0 11px #00c96a00; } 100%{ box-shadow:0 0 0 0 #00c96a00; } }
  .waveform{ display:flex; justify-content:center; gap:2px; height:13px; align-items:flex-end; margin-bottom:8px; }
  .waveform span{ width:2px; background:var(--green); border-radius:2px; animation:wave .9s ease-in-out infinite; }
  .waveform span:nth-child(1){ height:5px; } .waveform span:nth-child(2){ height:11px; animation-delay:.1s; }
  .waveform span:nth-child(3){ height:6px; animation-delay:.2s; } .waveform span:nth-child(4){ height:13px; animation-delay:.3s; }
  .waveform span:nth-child(5){ height:6px; animation-delay:.4s; }
  @keyframes wave{ 0%,100%{ transform:scaleY(.5);} 50%{ transform:scaleY(1);} }
  .phone-note{ text-align:center; font-size:8.5px; color:var(--muted); margin-bottom:8px; }
  .photo-req{ font-size:8px; color:var(--red); text-align:center; margin-bottom:6px; }
  .result-card{ background:#0A1E10; border:1px solid #00c96a33; border-radius:10px; padding:8px; font-size:8.5px; color:#7ACF9A; line-height:1.4; }
  .result-card b{ display:block; color:var(--green); font-size:9px; margin-bottom:2px; }
  .admin-mock{ width:100%; max-width:280px; background:var(--dark); border:1px solid var(--border); border-radius:16px; padding:15px; box-shadow:0 16px 32px -18px #000c; }
  .admin-mock h4{ font-size:10.5px; color:var(--muted); font-family:var(--mono); margin-bottom:9px; }
  .verify-row{ display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:9px; padding:7px 11px; margin-bottom:6px; font-size:11px; }
  .badge{ font-size:9px; font-weight:700; padding:2px 8px; border-radius:5px; font-family:var(--mono); }
  .badge-pending{ background:#f59e0b22; border:1px solid var(--amber); color:var(--amber); }
  .badge-verified{ background:#00c96a22; border:1px solid var(--green); color:var(--green); }
  .badge-high{ background:#ef444422; border:1px solid var(--red); color:var(--red); }
  .lb-row{ display:flex; align-items:center; gap:10px; padding:6px 4px; border-bottom:1px solid var(--border); font-size:11px; }
  .lb-row:last-child{ border-bottom:none; }
  .lb-rank{ font-family:var(--mono); font-weight:800; width:18px; color:var(--gold); }
  .lb-name{ flex:1; }
  .lb-credit{ font-family:var(--mono); color:var(--green); font-weight:700; }

  /* ===================== DEMO VIDEO (YouTube Shorts, 9:16) ===================== */
  .video-frame{
    width:min(62vw, 210px); aspect-ratio:9/16; margin:15px auto 0; border-radius:20px; overflow:hidden;
    border:1px solid var(--border); background:#000; box-shadow:0 20px 45px -18px #000a;
  }
  .video-frame iframe{ width:100%; height:100%; border:0; display:block; }
  .video-link{
    display:block; text-align:center; margin-top:11px; font-family:var(--mono); font-size:11px;
    color:var(--green); text-decoration:none;
  }
  .video-link:hover{ text-decoration:underline; }

  /* ===================== CREDITS OFFSET ===================== */
  .tier-grid{ display:grid; grid-template-columns:1fr; gap:9px; margin-top:15px; }
  .tier-card{ background:var(--card); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:12px; padding:11px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .tier-card.t-green{ border-left-color:var(--green); }
  .tier-card.t-amber{ border-left-color:var(--amber); }
  .tier-card.t-red{ border-left-color:var(--red); }
  .tier-card .t-level{ font-family:var(--mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; }
  .tier-card .t-note{ font-size:10.5px; color:var(--muted); margin-top:2px; }
  .tier-card .t-credit{ font-family:var(--mono); font-size:20px; font-weight:800; white-space:nowrap; }
  .tier-card.t-green .t-credit{ color:var(--green); }
  .tier-card.t-amber .t-credit{ color:var(--amber); }
  .tier-card.t-red .t-credit{ color:var(--red); }
  .offset-banner{
    margin-top:13px; text-align:center; font-size:12.5px; font-weight:700; color:var(--green);
    background:#0a1e14; border:1px solid #00c96a55; border-radius:12px; padding:12px 16px;
  }

  /* ===================== TRIAL RESULTS ===================== */
  .check-list{ margin-top:15px; display:flex; flex-direction:column; gap:7px; }
  .check-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--border); border-radius:10px; padding:9px 13px; font-size:11.5px;
  }
  .check-row .cr-value{ font-family:var(--mono); font-weight:700; color:var(--green); white-space:nowrap; font-size:11px; }
  .check-row .cr-label::before{ content:'✅ '; }

  /* ===================== REACTIVE -> PROACTIVE ===================== */
  .rp-row{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .rp-box{ padding:12px 15px; border-radius:12px; }
  .rp-box.reactive{ background:var(--card); border:1px solid var(--border); }
  .rp-box.proactive{ background:linear-gradient(120deg,#00c96a22,#a855f733); border:1px solid var(--green); }
  .rp-box .rp-title{ font-weight:800; font-size:13px; margin-bottom:3px; }
  .rp-box.reactive .rp-title{ color:var(--muted); }
  .rp-box.proactive .rp-title{ color:var(--green); }
  .rp-box p{ font-size:11px; color:var(--ice); }
  .rp-arrow{ text-align:center; font-size:16px; color:var(--green); transform:rotate(90deg); }
  .rp-groups{ display:grid; grid-template-columns:1fr; gap:8px; margin-top:12px; }
  .rp-group{ background:var(--card); border:1px solid var(--border); border-radius:11px; padding:10px 13px; }
  .rp-group h4{ font-size:11.5px; color:var(--green); margin-bottom:3px; }
  .rp-group p{ font-size:10.5px; color:var(--muted); }

  /* ===================== ROI ===================== */
  .roi-grid{ display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:15px; }
  .roi-cost{ width:100%; text-align:center; }
  .roi-cost .rc-label{ font-size:11px; color:var(--muted); margin-bottom:4px; }
  .roi-cost .rc-value{ font-family:var(--mono); font-size:22px; font-weight:800; color:var(--ice); }
  .roi-cost .rc-note{ font-size:10px; color:var(--muted); margin-top:4px; }
  .roi-protect{
    width:100%; text-align:center; padding:20px 16px; border-radius:18px;
    background:radial-gradient(circle at center, #00c96a2e, transparent 70%);
  }
  .roi-protect .rp-label{ font-size:12.5px; color:var(--white); margin-bottom:4px; }
  .roi-protect .rp-value{ font-family:var(--mono); font-size:32px; font-weight:800; color:var(--green); text-shadow:0 0 24px #00c96a66; }
  .roi-protect .rp-note{ font-size:11.5px; color:var(--ice); margin-top:3px; }

  /* ===================== CONTACT ===================== */
  .contact-slide{ text-align:center; }
  .contact-cards{ display:flex; flex-direction:column; gap:9px; margin-top:19px; }
  .contact-card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; text-align:left; }
  .contact-card .k{ font-family:var(--mono); font-size:9.5px; color:var(--muted); margin-bottom:4px; }
  .contact-card .v{ font-size:12.5px; font-weight:600; }
  .footer-line{ position:absolute; bottom:24px; left:0; right:0; text-align:center; font-family:var(--mono); font-size:9.5px; color:var(--muted); }
</style>
</head>
<body>

  ด้านล่าง — ไม่ต้องแตะ HTML/CSS/JS ส่วนอื่น แก้เสร็จแล้ว save แล้วเปิดไฟล์ใหม่ได้เลย
  ⚠️ ข้อควรระวัง 1: JSON ห้ามมี comma (,) ห้อยท้ายก่อนปิด } หรือ ] เด็ดขาด
  ⚠️ ข้อควรระวัง 2: ถ้าจะลบสไลด์ทั้งอัน ต้องลบให้ครบ 3 จุด ไม่ใช่แค่ตรงนี้:
     1) ก้อนข้อมูลใน JSON นี้   2) <section>...</section> ในหน้า HTML
     3) บรรทัด document.getElementById(...) ใน <script> ท้ายไฟล์ที่อ้างถึงสไลด์นั้น
     ถ้าลบไม่ครบ 3 จุด สคริปต์จะ error กลางทางและทำให้ทั้งหน้าใช้งานไม่ได้
  ============================================================================
-->

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('sv-data').textContent);
  const get = (obj, path) => path.split('.').reduce((o,k)=> (o||{})[k], obj);

  document.querySelectorAll('[data-key]').forEach(el=>{
    const val = get(DATA, el.getAttribute('data-key'));
    if(val !== undefined) el.textContent = val;
  });
  document.querySelectorAll('[data-key-html]').forEach(el=>{
    const val = get(DATA, el.getAttribute('data-key-html'));
    if(val !== undefined) el.innerHTML = val;
  });

  document.getElementById('hero-stats').innerHTML = DATA.hero.stats.map(s=>
    `<div class="pill">${s.value ? `<b>${s.value}</b> ` : ''}${s.label}</div>`
  ).join('');

  document.getElementById('chain-list').innerHTML = DATA.problemCulture.chain.map((c,i)=>
    (i>0 ? '<div class="chain-arrow">▼</div>' : '') +
    `<div class="chain-item${c.danger?' danger':''}"><span class="ci-icon">${c.icon}</span><span>${c.text}</span></div>`
  ).join('');
  document.getElementById('limits-row').innerHTML = DATA.problemCulture.limits.map(l=>`<div class="chip">${l}</div>`).join('');

  document.getElementById('obj-grid').innerHTML = DATA.objectives.items.map(o=>
    `<div class="obj-card"><span class="oi">${o.icon}</span><h4>${o.title}</h4><p>${o.body}</p></div>`
  ).join('');

  document.getElementById('cmp-table').innerHTML =
    `<div class="cmp-row head"><div class="cmp-cell dim">${DATA.comparison.headDim}</div><div class="cmp-cell old">${DATA.comparison.headOld}</div><div class="cmp-cell new" style="background:var(--dark)">${DATA.comparison.headNew}</div></div>` +
    DATA.comparison.rows.map(r=>
      `<div class="cmp-row"><div class="cmp-cell dim">${r.dim}</div><div class="cmp-cell old">${r.old}</div><div class="cmp-cell new">${r.new}</div></div>`
    ).join('');

  document.getElementById('product-verify').innerHTML = DATA.product.verifyRows.map(r=>
    `<div class="verify-row"><span>${r.label}</span><span class="badge badge-${r.badge}">${r.badgeText}</span></div>`
  ).join('');
  document.getElementById('product-leaderboard').innerHTML = DATA.product.leaderboard.map(r=>
    `<div class="lb-row"><span class="lb-rank">${r.rank}</span><span class="lb-name">${r.name}</span><span class="lb-credit">${r.credit}</span></div>`
  ).join('');

  const demoIframe = document.getElementById('demo-iframe');
  demoIframe.src = `https://www.youtube.com/embed/${DATA.demo.videoId}`;
  demoIframe.title = DATA.demo.videoTitle;
  const demoLink = document.getElementById('demo-link');
  demoLink.href = `https://youtube.com/shorts/${DATA.demo.videoId}`;
  demoLink.textContent = DATA.demo.linkLabel;

  document.getElementById('tier-grid').innerHTML = DATA.creditsOffset.tiers.map(t=>
    `<div class="tier-card t-${t.tone}"><div><div class="t-level">${t.level}</div><div class="t-note">${t.note}</div></div><div class="t-credit">${t.credit}</div></div>`
  ).join('');

  document.getElementById('check-list').innerHTML = DATA.trial.rows.map(r=>
    `<div class="check-row"><span class="cr-label">${r.label}</span><span class="cr-value">${r.value}</span></div>`
  ).join('');

  document.getElementById('rp-groups').innerHTML = DATA.reactive.groups.map(g=>
    `<div class="rp-group"><h4>${g.title}</h4><p>${g.body}</p></div>`
  ).join('');

  document.getElementById('contact-cards').innerHTML = DATA.contact.cards.map(c=>
    `<div class="contact-card"><div class="k">${c.label}</div><div class="v">${c.value}</div></div>`
  ).join('');

  const slidesEl = document.getElementById('slides');
  const slides = [...document.querySelectorAll('.slide')];
  const dotnav = document.getElementById('dotnav');

  slides.forEach((s,i)=>{
    const b = document.createElement('button');
    b.setAttribute('aria-label', s.dataset.label);
    b.addEventListener('click', ()=> goTo(i));
    dotnav.appendChild(b);
  });
  const dots = [...dotnav.children];

  let current = 0;
  function updateActive(i){
    current = i;
    dots.forEach((d,j)=> d.classList.toggle('active', j===i));
  }
  function goTo(i){
    i = Math.max(0, Math.min(slides.length-1, i));
    slides[i].scrollIntoView({ behavior:'smooth' });
  }

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const idx = slides.indexOf(e.target);
        updateActive(idx);
        e.target.querySelectorAll('.fade-up').forEach(el=> el.classList.add('in'));
      }
    });
  }, { root: slidesEl, threshold: 0.55 });
  slides.forEach(s=> io.observe(s));
  updateActive(0);
})();
</script>

</body>
</html>
